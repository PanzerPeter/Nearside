name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js warns on every import under 20 and
          # will drop support for it.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
