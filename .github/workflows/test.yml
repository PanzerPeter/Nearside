name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # One red job should not hide the other two: a type error and a lint
      # error are usually the same edit, and seeing both at once is one round
      # trip instead of three.
      fail-fast: false
      matrix:
        task: [test, lint, typecheck]
    name: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js warns on every import under 20 and
          # will drop support for it.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.task }}
