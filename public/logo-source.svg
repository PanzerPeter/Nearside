<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cool-grey canvas, matching base-200/base-300. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202225"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <!-- Blue brand accent (#3b82f6) with a lighter top edge. -->
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile. -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Speech bubble, kept inside the maskable safe zone (center ~62%). -->
  <g filter="url(#soft)">
    <path fill="url(#bubble)" d="
      M172 132
      h168
      a56 56 0 0 1 56 56
      v104
      a56 56 0 0 1 -56 56
      h-96
      l-58 46
      a10 10 0 0 1 -16 -8
      v-38
      h-2
      a56 56 0 0 1 -52 -56
      v-104
      a56 56 0 0 1 56 -56
      z"/>
  </g>

  <!-- Three conversation dots. -->
  <g fill="#1a1b1e">
    <circle cx="212" cy="240" r="17"/>
    <circle cx="270" cy="240" r="17"/>
    <circle cx="328" cy="240" r="17"/>
  </g>
</svg>
