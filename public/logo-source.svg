<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    "The near gap".

    One disc cut on the diagonal and slid apart, so what the mark is actually
    made of is the sliver between the two halves. The name is a word for the
    side nearest you, and a gap this narrow is as near as two separate things
    get without becoming one — which is also the shape of the product: two
    people, nothing in between them, and nothing able to get in between them.

    No letterform anywhere. The silhouette survives to favicon size because it
    is one circle and one line, and the halves keep their own lightness so the
    upper one reads as the face turned toward the viewer.

    Every corner is rounded by `stroke-linejoin: round` with a stroke of the
    fill: the paths below are drawn at r=126 and grown to r=136 by a 20px
    stroke, which rounds the four right angles where each arc meets its chord
    without any of them having to be described by hand.
  -->
  <defs>
    <!-- Cool-grey canvas, matching base-200/base-300. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202225"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <!-- The near half: lit, and the brand blue at full strength. -->
    <linearGradient id="near" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#93c5ff"/>
      <stop offset="1" stop-color="#4a8ff7"/>
    </linearGradient>
    <!-- The far half: the same blue with the light taken off it. -->
    <linearGradient id="far" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2f66c4"/>
      <stop offset="1" stop-color="#1d4187"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile. -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Outer radius 136, so the whole mark sits inside the maskable safe zone
       (a circle of radius 205 about the centre). -->
  <g filter="url(#soft)">
    <!-- Far half: below the cut, slid down-left. -->
    <path
      fill="url(#far)" stroke="url(#far)" stroke-width="20" stroke-linejoin="round"
      transform="translate(-10.32 14.74)"
      d="M 359.21 328.27 A 126 126 0 0 1 152.79 183.73 Z"/>
    <!-- Near half: above the cut, slid up-right. -->
    <path
      fill="url(#near)" stroke="url(#near)" stroke-width="20" stroke-linejoin="round"
      transform="translate(10.32 -14.74)"
      d="M 152.79 183.73 A 126 126 0 0 1 359.21 328.27 Z"/>
  </g>
</svg>
